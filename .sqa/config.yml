        container: qc.sty_leaky-magenta-horse
      gitlab.com/dtgeo.wp5dtc1/dtc51 jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.snazzy-flax-ladybird.sh
        container: qc.sty_trippy-linen-ibis
  QC.Uni:
