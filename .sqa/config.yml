        - /usr/bin/env sh .sqa/script.lovely-yellow-worm.sh
        container: qc.doc_homely-peach-tarantula
      gitlab.com/dtgeo.wp5dtc1/dtc51 git:
        commands:
        - /usr/bin/env sh .sqa/script.messy-coral-albatross.sh
        container: qc.doc_frumpy-auburn-snake
      gitlab.com/dtgeo.wp5dtc1/dtc51 markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.stuffy-mustard-echidna.sh
        container: qc.doc_squirrely-grey-nightingale
  QC.Lic:
    repos:
      gitlab.com/dtgeo.wp5dtc1/dtc51 licensee:
